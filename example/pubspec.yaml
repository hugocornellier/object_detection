name: object_detection_example
description: Example app for object_detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  opencv_dart: 2.2.1+4
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  file_selector_macos: ^0.9.5
  object_detection:
    path: ../
  # Direct dependency so the example can import OneEuroFilter / FrameThrottle
  # from flutter_litert for video smoothing and live-camera throttling.
  flutter_litert: ^3.5.1
  flutter_colorpicker: ^1.1.0
  camera: ^0.12.0
  camera_desktop: ^1.2.1
  sensors_plus: ^6.1.1
  video_player: ^2.9.2
  path_provider: ^2.1.5

# video_player_avfoundation 2.9.7's macOS Swift Package imports the iOS-only
# <Flutter/Flutter.h> module, which fails to build on macOS ("module 'Flutter'
# not found"). Pin to 2.9.4, the last version that builds on macOS, until the
# upstream package is fixed.
dependency_overrides:
  video_player_avfoundation: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The Video File demo uses OpenCV's videoio (VideoCapture/VideoWriter) to read
# input MP4s and write annotated output. imgcodecs/imgproc cover decode + draw.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
